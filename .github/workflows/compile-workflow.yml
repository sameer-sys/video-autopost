name: Compile & Post
on:
  schedule:
    - cron: '30 6 * * *'   # 12:00 IST daily (weekly compile runs on Sundays inside the script)
  workflow_dispatch:

concurrency:
  group: bot-pipeline
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          pip install yt-dlp
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Run compilation pipeline
        run: python compile.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit state back
        run: |
          git config user.name "video-autopost-bot"
          git config user.email "video-autopost-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "state: compile $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/sameer-sys/video-autopost.git main || true
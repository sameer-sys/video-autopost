name: Trend Picker Bot

on:
  schedule:
    - cron: '30 3 * * *'   # 09:00 IST daily — picks trend before script bot
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trend-pipeline
  cancel-in-progress: false

jobs:
  trend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run trend picker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YOUR_YT_CHANNEL_ID: UCx_eggTH3zOcuLDr2iYayoA
        run: python3 trend_bot.py
      - name: Commit trend state
        run: |
          git config user.name "video-autopost-bot"
          git config user.email "video-autopost-bot@users.noreply.github.com"
          git add trend_state.json || true
          git diff --cached --quiet || git commit -m "trend: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main || true
          git push origin main || true

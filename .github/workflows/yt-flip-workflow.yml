name: YT Morning Public Flip

on:
  schedule:
    - cron: '30 3 * * *'   # 09:00 IST daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yt-flip-pipeline
  cancel-in-progress: false

jobs:
  flip:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run YT Morning Public Flip
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python3 yt_flip_bot.py
      - name: Commit state
        run: |
          git config user.name "video-autopost-bot"
          git config user.email "video-autopost-bot@users.noreply.github.com"
          git add yt_flip_state.json || true
          git diff --cached --quiet || git commit -m "flip: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main || true
          git push origin main || true
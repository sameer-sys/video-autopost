name: Script Bot

on:
  schedule:
    - cron: '0 4 * * *'   # 09:30 IST daily — after trend picker (03:30 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: script-pipeline
  cancel-in-progress: false

jobs:
  script:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run script bot (Telegram delivery)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YOUR_YT_CHANNEL_ID: UCx_eggTH3zOcuLDr2iYayoA
        run: python3 script_bot.py
      - name: Commit script state
        run: |
          git config user.name "video-autopost-bot"
          git config user.email "video-autopost-bot@users.noreply.github.com"
          git add script_state.json trend_state.json || true
          git diff --cached --quiet || git commit -m "script: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main || true
          git push origin main || true

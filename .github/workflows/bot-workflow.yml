name: Video Autopost 24/7

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6h: restarts the long loop; queue delays are fine
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write           # needed to commit state.json back

concurrency:
  group: bot-pipeline       # never two runs at once: no state races, no duplicates
  cancel-in-progress: true  # cancel old run when new one starts

jobs:
  bot-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 4260   # 71h: public repo allows 72h jobs -> continuous polling
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Telegram pipeline (continuous loop)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 telegram_loop.py

      - name: Commit state back (idempotency)
        run: |
          git config user.name "video-autopost-bot"
          git config user.email "video-autopost-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase -X ours origin main || true
          git push origin main

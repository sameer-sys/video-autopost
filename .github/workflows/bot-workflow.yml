name: Posting Bot (Main)

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6h: restarts the long loop
  workflow_dispatch:        # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: bot-pipeline       # never two runs at once
  cancel-in-progress: true  # cancel old run when new one starts

jobs:
  bot-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 4260   # 71h: public repo allows 72h jobs
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install python dependencies
        run: pip install requests telethon
      - name: Run Posting Bot (24/7 loop with platform tricks)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TG_API_BASE: ${{ secrets.TG_API_BASE }}
          TG_FILE_BASE: ${{ secrets.TG_FILE_BASE }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELETHON_SESSION: ${{ secrets.TELETHON_SESSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 telegram_loop.py
      - name: Commit state back
        run: |
          git config user.name "video-autopost-bot"
          git config user.email "video-autopost-bot@users.noreply.github.com"
          git add state.json videos.json || true
          git diff --cached --quiet || git commit -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase -X ours origin main || true
          git push origin main || true
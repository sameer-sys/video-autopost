name: Manager Bot

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours: 01:30, 04:30, 07:30, 10:30, 13:30, 16:30, 19:30, 22:30 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manager-pipeline
  cancel-in-progress: false

jobs:
  manager:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Manager Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 manager_bot.py
name: Channel Analytics Bot
on:
  schedule:
    - cron: '30 */6 * * *'   # every 6h: checks your channels + competitor moves
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analytics-pipeline
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run analytics + email you
        env:
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_TOKEN:    ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID:       ${{ secrets.IG_USER_ID }}
          IG_TOKEN:         ${{ secrets.IG_TOKEN }}
          GMAIL_USER:       ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:         ${{ secrets.EMAIL_TO }}
          YOUR_YT_CHANNEL_ID: UCx_eggTH3zOcuLDr2iYayoA
          YOUR_IG_USER_ID:   ${{ secrets.YOUR_IG_USER_ID }}
        run: python3 analytics_bot.py
      - name: Commit analytics state back
        run: |
          git config user.name "video-autopost-bot"
          git config user.email "video-autopost-bot@users.noreply.github.com"
          git add analytics_state.json || true
          git diff --cached --quiet || git commit -m "analytics: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin main || true

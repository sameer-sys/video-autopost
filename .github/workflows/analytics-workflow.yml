name: Channel Analytics Bot
on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
  workflow_call:
    inputs:
      gmail_app_password:
        description: 'Gmail app password'
        required: false
        type: string
      gmail_user:
        description: 'Gmail user'
        required: false
        type: string
      email_to:
        description: 'Email recipient'
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: analytics-pipeline
  cancel-in-progress: false

jobs:
  inject-secrets:
    runs-on: ubuntu-latest
    outputs:
      secrets_injected: ${{ steps.inject.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Inject email secrets
        id: inject
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EMAIL_PASS: ${{ inputs.gmail_app_password }}
        run: |
          python3 inject_secrets.py
          echo "result=success" >> $GITHUB_OUTPUT

  analytics:
    needs: inject-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run analytics + email
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          YOUR_YT_CHANNEL_ID: UCx_eggTH3zOcuLDr2iYayoA
        run: python3 analytics_bot.py
      - name: Commit state back
        run: |
          git config user.name "video-autopost-bot"
          git config user.email "video-autopost-bot@users.noreply.github.com"
          git add analytics_state.json || true
          git diff --cached --quiet || git commit -m "analytics: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin main || true

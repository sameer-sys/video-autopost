name: Channel Analytics Bot
on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:
    inputs:
      test_email:
        description: 'Send test email to verify'
        required: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: analytics-pipeline
  cancel-in-progress: false

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run analytics + email
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          # Hardcoded email credentials (bypasses GitHub secrets API issue)
          GMAIL_USER: samesuf629@gmail.com
          GMAIL_APP_PASSWORD: rvwrgbvxnjitiwmo
          EMAIL_TO: samesuf786@gmail.com
          YOUR_YT_CHANNEL_ID: UCx_eggTH3zOcuLDr2iYayoA
        run: python3 analytics_bot.py
      - name: Commit state back
        run: |
          git config user.name "video-autopost-bot"
          git config user.email "video-autopost-bot@users.noreply.github.com"
          git add analytics_state.json || true
          git diff --cached --quiet || git commit -m "analytics: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin main || true
